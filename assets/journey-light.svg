<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 660" width="100%" role="img" aria-labelledby="t d"><title id="t">Harsh Vardhan Singh's project journey, drawn as a metro map</title><desc id="d">Three lines run from 2024 to October 2026. Systems: sorting algorithms, a Twitter API, a matching engine, Aurora DNS, ending at the Distributed Rate Limiter. Product: portfolio, real-time chat, legalsummary.ai, BotForge, ReviveX. ML research branches off product in 2026: sparse neural networks, diffusion models, fuzzy pooling, churn, Self-Healing RAG, OCR Grader. Product and ML meet at Booking Agent.</desc><style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
    .label{font-size:22px;font-weight:600;fill:#1f2328}
    .strong{font-size:25px;font-weight:700}
    .sub{font-size:19px;fill:#59636e}
    .year{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;font-size:19px;font-weight:600;letter-spacing:2px;fill:#59636e}
    .legend{font-size:21px;font-weight:700;fill:#1f2328}
    .line{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
    .tail{fill:none;stroke-width:5;stroke-dasharray:3 13;stroke-linecap:round;stroke:#59636e}
    .dot{fill:#ffffff;stroke-width:6}
    .pulse{opacity:.18;transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-in-out infinite}
    .train{stroke:#ffffff;stroke-width:2}
    .systems-line{stroke:#0891b2}.product-line{stroke:#d97706}.ml-line{stroke:#9333ea}
    .systems-stroke{stroke:#0891b2}.product-stroke{stroke:#d97706}.ml-stroke{stroke:#9333ea}
    .systems-fill{fill:#0891b2}.product-fill{fill:#d97706}.ml-fill{fill:#9333ea}
    @keyframes pulse{50%{transform:scale(1.25);opacity:.05}}
    @media (prefers-reduced-motion:reduce){.pulse{animation:none}.train{display:none}}
    </style><rect x="1" y="1" width="1558" height="658" rx="18" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="2"/><text x="185.0" y="62" text-anchor="middle" class="year">2024</text><text x="510.0" y="62" text-anchor="middle" class="year">2025</text><line x1="330" y1="84" x2="330" y2="560" stroke="#e6eaef" stroke-width="2" stroke-dasharray="4 8"/><text x="875.0" y="62" text-anchor="middle" class="year">EARLY 2026</text><line x1="690" y1="84" x2="690" y2="560" stroke="#e6eaef" stroke-width="2" stroke-dasharray="4 8"/><text x="1190.0" y="62" text-anchor="middle" class="year">MID 2026</text><line x1="1060" y1="84" x2="1060" y2="560" stroke="#e6eaef" stroke-width="2" stroke-dasharray="4 8"/><text x="1420.0" y="62" text-anchor="middle" class="year">OCT 2026</text><line x1="1320" y1="84" x2="1320" y2="560" stroke="#e6eaef" stroke-width="2" stroke-dasharray="4 8"/><path d="M 1422 190 H 1500" class="tail"/><path d="M 1422 420 H 1500" class="tail"/><path d="M 60 190 H 1400" class="line systems-line"/><path d="M 60 350 H 1330 L 1400 420" class="line product-line"/><path d="M 560 350 L 700 490 H 1330 L 1400 420" class="line ml-line"/><g class="stop"><circle cx="90" cy="190" r="11" class="dot systems-stroke"/><text x="90" y="160" text-anchor="middle" class="label">Sorting Algos</text></g><g class="stop"><circle cx="250" cy="190" r="11" class="dot systems-stroke"/><text x="250" y="234" text-anchor="middle" class="label">Twitter API</text></g><g class="stop"><circle cx="420" cy="190" r="11" class="dot systems-stroke"/><text x="420" y="160" text-anchor="middle" class="label">Matching Engine</text></g><g class="stop"><circle cx="590" cy="190" r="11" class="dot systems-stroke"/><text x="590" y="234" text-anchor="middle" class="label">Aurora DNS</text></g><g class="stop"><circle cx="90" cy="350" r="11" class="dot product-stroke"/><text x="90" y="320" text-anchor="middle" class="label">Portfolio</text></g><g class="stop"><circle cx="420" cy="350" r="11" class="dot product-stroke"/><text x="420" y="320" text-anchor="middle" class="label">Real-time Chat</text></g><g class="stop"><circle cx="1090" cy="350" r="11" class="dot product-stroke"/><text x="1090" y="320" text-anchor="middle" class="label">legalsummary.ai</text></g><g class="stop"><circle cx="1190" cy="350" r="11" class="dot product-stroke"/><text x="1190" y="394" text-anchor="middle" class="label">BotForge</text></g><g class="stop"><circle cx="1290" cy="350" r="11" class="dot product-stroke"/><text x="1290" y="320" text-anchor="middle" class="label">ReviveX</text></g><g class="stop"><circle cx="740" cy="490" r="11" class="dot ml-stroke"/><text x="740" y="460" text-anchor="middle" class="label">Sparse NNs</text></g><g class="stop"><circle cx="830" cy="490" r="11" class="dot ml-stroke"/><text x="830" y="534" text-anchor="middle" class="label">Diffusion</text></g><g class="stop"><circle cx="920" cy="490" r="11" class="dot ml-stroke"/><text x="920" y="460" text-anchor="middle" class="label">Fuzzy Pooling</text></g><g class="stop"><circle cx="1010" cy="490" r="11" class="dot ml-stroke"/><text x="1010" y="534" text-anchor="middle" class="label">Churn</text></g><g class="stop"><circle cx="1120" cy="490" r="11" class="dot ml-stroke"/><text x="1120" y="460" text-anchor="middle" class="label">Self-Healing RAG</text></g><g class="stop"><circle cx="1260" cy="490" r="11" class="dot ml-stroke"/><text x="1260" y="534" text-anchor="middle" class="label">OCR Grader</text></g><g class="stop"><circle cx="1400" cy="190" r="28" class="pulse systems-fill"/><circle cx="1400" cy="190" r="20" class="dot systems-stroke"/><circle cx="1400" cy="190" r="12" class="dot systems-stroke"/><text x="1400" y="150" text-anchor="middle" class="label strong">Rate Limiter</text><text x="1400" y="244" text-anchor="middle" class="sub">shipped Oct 2026</text></g><g class="stop"><circle cx="1400" cy="420" r="28" class="pulse product-fill"/><circle cx="1400" cy="420" r="20" class="dot product-stroke"/><circle cx="1400" cy="420" r="12" class="dot ml-stroke"/><text x="1372" y="380" text-anchor="start" class="label strong">Booking Agent</text><text x="1372" y="474" text-anchor="start" class="sub">live demo</text></g><circle r="6" class="train systems-fill"><animateMotion dur="11s" begin="0.0s" repeatCount="indefinite" path="M 60 190 H 1400"/></circle><circle r="6" class="train product-fill"><animateMotion dur="13s" begin="1.2s" repeatCount="indefinite" path="M 60 350 H 1330 L 1400 420"/></circle><circle r="6" class="train ml-fill"><animateMotion dur="15s" begin="2.4s" repeatCount="indefinite" path="M 560 350 L 700 490 H 1330 L 1400 420"/></circle><line x1="60" y1="610" x2="104" y2="610" class="systems-stroke" stroke-width="9" stroke-linecap="round"/><text x="120" y="603" class="legend">Systems</text><text x="120" y="630" class="sub">how software works underneath</text><line x1="550" y1="610" x2="594" y2="610" class="product-stroke" stroke-width="9" stroke-linecap="round"/><text x="610" y="603" class="legend">Product</text><text x="610" y="630" class="sub">things people can click on</text><line x1="1040" y1="610" x2="1084" y2="610" class="ml-stroke" stroke-width="9" stroke-linecap="round"/><text x="1100" y="603" class="legend">ML research</text><text x="1100" y="630" class="sub">models, then models in production</text></svg>